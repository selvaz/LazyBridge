<text x="410" y="1116" text-anchor="middle">Writes a cited brief</text>
<text class="secondary" x="410" y="1149" text-anchor="middle">Uses support + challenge + review</text>
<text class="secondary" x="52" y="1235">Same specialists, also called directly</text>
<rect class="box" x="48" y="1256" width="350" height="154" rx="16"/>
