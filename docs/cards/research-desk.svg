<svg xmlns="http://www.w3.org/2000/svg" class="lb-card-1" viewBox="0 0 820 1640" style="display:block;width:100%;height:auto" role="img" aria-labelledby="lb-card-1-title lb-card-1-desc">
<title id="lb-card-1-title">Research desk</title>
<desc id="lb-card-1-desc">A question enters research_desk, a Claude Code Opus lead agent, and a cited answer comes out. Its tools are research_brief, deep_research and fact_check. research_brief is a deterministic Plan: support uses deep_research and challenge uses fact_check in parallel; review reads both through from_parallel_all; summary, on the DeepSeek API, uses from_step to write a cited brief from support, challenge and review. The same two specialists can also be called directly by the lead.</desc>
<style>
.lb-card-1 text{fill:var(--md-default-fg-color,#222);font-family:var(--md-text-font-family,system-ui),sans-serif;font-size:26px}
.lb-card-1 .title{font-size:44px;font-weight:700;letter-spacing:-1px}
.lb-card-1 .name{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:32px;font-weight:600}
.lb-card-1 .code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:25px}
.lb-card-1 .secondary{fill:var(--md-default-fg-color--light,#666)}
.lb-card-1 .heading{font-size:32px;font-weight:600}
.lb-card-1 .message{font-size:32px;font-weight:500}
.lb-card-1 .panel{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}
.lb-card-1 .box{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}
.lb-card-1 .wire{fill:none;stroke:var(--md-default-fg-color--light,#666);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb-card-1 .arrow{marker-end:url(#lb-card-1-arrow)}
.lb-card-1 .arrowhead,.lb-card-1 .junction{fill:var(--md-default-fg-color--light,#666)}
.lb-card-1 .claude{stroke:#d97757;stroke-width:5;stroke-linecap:round}
.lb-card-1 .codex{stroke:#10a37f;stroke-width:5;stroke-linecap:round}
.lb-card-1 .claude-dot{fill:#d97757}
.lb-card-1 .codex-dot{fill:#10a37f}
.lb-card-1 .api{stroke:#4d6bfe;stroke-width:5;stroke-linecap:round}
.lb-card-1 .api-dot{fill:#4d6bfe}
</style>
<defs>
<marker id="lb-card-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path class="arrowhead" d="M1 1 9 5 1 9Z"/>
</marker>
</defs>
